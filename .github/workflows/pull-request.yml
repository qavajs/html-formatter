name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cucumber-version: [12, 13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install @cucumber/cucumber@${{ matrix.cucumber-version }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run report:generate # builds template first (prereport:generate)
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-cucumber-${{ matrix.cucumber-version }}
          path: test/report/report.html
